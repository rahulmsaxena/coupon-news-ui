<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bond Summary | Point75</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<!--
  Bond Summary page for point75.io/bondsummary.
  Data: /api/bondsummary-list (summaries, labeled by trading day) and /api/yields-ytd (FRED yields).
  Works served from this Vercel project, or pasted/embedded on point75.io (it calls the
  Vercel API by absolute URL when it isn't running on Vercel).

  Layout
    List view:    headline + latest levels, a horizontally scrolling rail of charts,
                  then summaries across the page (newest first, latest one featured).
    Article view: one summary, with a back link, previous/next, and a back-to-top button.

  Adding a chart: see "CHARTS" in the script below. Each chart is one entry in a list;
  new data (e.g. private credit) is one entry in "SOURCES" pointing at an /api endpoint.
-->
<style>
  :root {
    --bg: #111214;          /* page: charcoal */
    --surface: #1a1b1e;     /* cards */
    --surface-2: #212226;   /* raised bits: tiles, pills */
    --line: #2b2d32;        /* hairlines */
    --gold: #c9a227;        /* accent: borders, labels, active states */
    --gold-soft: rgba(201, 162, 39, .38);
    --gold-wash: rgba(201, 162, 39, .10);
    --ink: #ede8dc;         /* body text: cream */
    --ink-2: #b8b2a5;
    --ink-3: #8a857a;
    --up: #d9695f;          /* yield up (bond prices down) */
    --down: #72b58d;        /* yield down */
    --s2: #8f9bb0;          /* 2Y: steel */
    --s10: #ede8dc;         /* 10Y: cream */
    --s30: #c9a227;         /* 30Y: gold */
    --focus: #e6c35a;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; background: var(--bg); color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
  [hidden] { display: none !important; }
  .serif { font-family: "Source Serif 4", Georgia, serif; }

  /* Site header (only shown when this page is opened directly, not when embedded) */
  .site { border-bottom: 1px solid var(--line); }
  .site .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; }
  .brand { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 1.15rem; text-decoration: none; color: var(--gold); }
  .site nav { display: flex; gap: 28px; font-size: .95rem; }
  .site nav a { text-decoration: none; color: var(--ink-2); padding: 4px 0; }
  .site nav a[aria-current] { color: var(--ink); border-bottom: 1px solid var(--gold); }

  /* Shared bits */
  .eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--gold-soft); border-radius: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--gold-soft); border-radius: 7px; overflow: hidden; }
  .seg button { background: none; border: 0; padding: 4px 11px; font-size: .78rem; cursor: pointer; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--gold); color: var(--bg); font-weight: 600; }
  .iconbtn { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 50%; border: 1px solid var(--gold-soft); background: var(--surface); cursor: pointer; color: var(--ink); }
  .iconbtn:hover:not(:disabled) { border-color: var(--gold); }
  .iconbtn:disabled { opacity: .35; cursor: default; }
  .iconbtn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .d.up { color: var(--up); } .d.down { color: var(--down); } .d.flat { color: var(--ink-3); }
  .tag { display: inline-block; font-size: .64rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--gold-soft); color: var(--gold); white-space: nowrap; }
  .tag.solid { background: var(--gold); border-color: var(--gold); color: var(--bg); }
  .tag.muted { border-color: var(--line); color: var(--ink-3); }

  /* ---------- List view ---------- */
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; padding: 30px 0 18px; }
  .hero h1 { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: clamp(1.7rem, 3.2vw, 2.3rem); margin: 4px 0 2px; line-height: 1.15; }
  .hero p { margin: 0; color: var(--ink-2); font-size: .95rem; }

  /* Latest levels */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 26px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-top: 2px solid var(--gold); border-radius: 0 0 8px 8px; padding: 10px 14px; }
  .stat .k { font-size: .74rem; color: var(--ink-3); letter-spacing: .02em; }
  .stat .v { font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .stat .d { font-size: .76rem; font-variant-numeric: tabular-nums; }

  /* Section heads */
  .sechead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 0 12px; }
  .sechead h2 { margin: 0; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  .sechead .tools { display: flex; align-items: center; gap: 8px; }
  .count { font-size: .78rem; color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

  /* Chart rail: scrolls sideways, snaps to each chart */
  .rail { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 24px; padding: 2px 24px 14px; margin: 0 -24px 30px;
          scrollbar-width: thin; scrollbar-color: var(--gold-soft) transparent; overscroll-behavior-x: contain; }
  .rail::-webkit-scrollbar { height: 6px; }
  .rail::-webkit-scrollbar-thumb { background: var(--gold-soft); border-radius: 3px; }
  .chart { flex: 0 0 clamp(300px, calc((100% - 16px) / 2), 600px); scroll-snap-align: start; padding: 16px 18px 12px; display: flex; flex-direction: column; min-width: 0; }
  .chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .chart-head h3 { margin: 0; font-size: .98rem; font-weight: 600; }
  .chart-head .group { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
  .legend { display: flex; gap: 14px; font-size: .76rem; color: var(--ink-2); margin-bottom: 4px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .legend .dotkey { display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 2px solid var(--gold); background: var(--surface); vertical-align: 0; margin-right: 6px; }
  .chartbox { position: relative; flex: 1; min-height: 220px; }
  .chartbox svg { display: block; width: 100%; height: 220px; overflow: visible; }
  .chartbox .msg { height: 220px; display: grid; place-items: center; text-align: center; color: var(--ink-3); font-size: .85rem; padding: 0 20px; }
  .axis text { fill: var(--ink-3); font-size: 11px; font-family: Inter, sans-serif; }
  .grid line { stroke: var(--line); }
  .zero { stroke: var(--ink-3); stroke-dasharray: 2 3; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .76rem; line-height: 1.45; padding: 7px 10px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); opacity: 0; transition: opacity .1s; z-index: 2; }
  .tip .open { opacity: .7; }
  .source { font-size: .72rem; color: var(--ink-3); margin-top: 6px; }
  .chart.soon { justify-content: center; align-items: center; text-align: center; border-style: dashed; background: transparent; min-height: 300px; }
  .chart.soon p { margin: 6px 0 0; color: var(--ink-3); font-size: .85rem; max-width: 260px; }

  /* Summaries across the page, newest first; the latest one is featured */
  .filters input { font: inherit; font-size: .85rem; padding: 6px 10px; border: 1px solid var(--gold-soft); border-radius: 7px; background: var(--surface); color: var(--ink); width: 210px; }
  .filters input::placeholder { color: var(--ink-3); }
  .cards { list-style: none; margin: 0 0 64px; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .cards > li { display: flex; }
  .sum { display: flex; flex-direction: column; gap: 8px; width: 100%; padding: 18px 20px; text-decoration: none; transition: border-color .15s, background .15s; }
  .sum:hover { border-color: var(--gold); background: #1d1e22; }
  .sum .tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .sum .when { font-size: .78rem; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-left: auto; white-space: nowrap; }
  .sum h3 { font-family: "Source Serif 4", Georgia, serif; font-size: 1.18rem; font-weight: 600; margin: 0; line-height: 1.3; }
  .sum p { margin: 0; color: var(--ink-2); font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .sum .go { margin-top: auto; padding-top: 4px; font-size: .84rem; font-weight: 500; color: var(--gold); }
  .cards > li.lead { grid-column: 1 / -1; }
  .lead .sum { border-color: var(--gold); padding: 22px 26px; display: grid; grid-template-columns: minmax(0, 1fr) 260px; column-gap: 32px; }
  .lead .sum .main { display: flex; flex-direction: column; gap: 10px; }
  .lead .sum h3 { font-size: clamp(1.35rem, 2.4vw, 1.75rem); }
  .lead .sum p { -webkit-line-clamp: 4; font-size: .98rem; }
  .lead .sum .aside { border-left: 1px solid var(--line); padding-left: 24px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; font-size: .84rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .lead .sum .aside b { color: var(--ink); font-weight: 600; }
  .lead .sum .aside .row { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 4px 0; }
  .sum.read h3, .sum.read p { opacity: .6; }
  .empty { padding: 40px 8px; color: var(--ink-3); grid-column: 1 / -1; }

  /* ---------- Article view ---------- */
  .progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--gold); z-index: 30; transition: width .1s linear; }
  .stickybar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid transparent; transition: border-color .2s; }
  .stickybar.scrolled { border-bottom-color: var(--line); }
  .stickybar .wrap { display: flex; align-items: center; gap: 12px; height: 52px; max-width: 752px; }
  .back { display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px; margin-left: -8px; border-radius: 6px; font-size: .9rem; font-weight: 500; color: var(--gold); text-decoration: none; }
  .back:hover { background: var(--gold-wash); }
  .stickybar .crumb { margin-left: auto; font-size: .84rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .article { max-width: 720px; margin: 0 auto; padding: 26px 24px 40px; }
  .article h1 { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: clamp(1.8rem, 4vw, 2.4rem); line-height: 1.2; margin: 8px 0 10px; }
  .meta { color: var(--ink-3); font-size: .86rem; }
  .snap { display: flex; gap: 18px; flex-wrap: wrap; margin: 18px 0 0; padding: 12px 14px; border: 1px solid var(--gold-soft); border-radius: 8px; background: var(--surface); font-size: .84rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .snap b { color: var(--ink); font-weight: 600; }
  .toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; padding: 0; list-style: none; }
  .toc button { background: var(--surface); border: 1px solid var(--gold-soft); border-radius: 99px; padding: 5px 12px; font-size: .8rem; cursor: pointer; color: var(--ink-2); }
  .toc button:hover { color: var(--ink); border-color: var(--gold); }
  .body { font-family: "Source Serif 4", Georgia, serif; font-size: 1.12rem; line-height: 1.72; margin-top: 26px; }
  .body h2 { font-family: Inter, sans-serif; font-size: 1.15rem; font-weight: 600; margin: 2em 0 .5em; scroll-margin-top: 70px; color: var(--gold); }
  .body h3 { font-family: Inter, sans-serif; font-size: 1rem; font-weight: 600; margin: 1.6em 0 .4em; scroll-margin-top: 70px; }
  .body p { margin: 0 0 1.1em; }
  .body ul, .body ol { padding-left: 1.3em; margin: 0 0 1.1em; }
  .body li { margin-bottom: .45em; }
  .body strong { font-weight: 600; }
  .body a { color: var(--gold); }
  .body blockquote { margin: 1.4em 0; padding: 2px 0 2px 18px; border-left: 2px solid var(--gold); color: var(--ink-2); }
  .body table { border-collapse: collapse; width: 100%; font-family: Inter, sans-serif; font-size: .88rem; margin: 1.2em 0; display: block; overflow-x: auto; }
  .body th, .body td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; }
  .body hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); }
  .pager a { display: block; text-decoration: none; border: 1px solid var(--gold-soft); border-radius: 8px; padding: 12px 14px; background: var(--surface); transition: border-color .15s; }
  .pager a:hover { border-color: var(--gold); }
  .pager .lbl { font-size: .76rem; color: var(--ink-3); }
  .pager .t { font-size: .9rem; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pager .next { text-align: right; grid-column: 2; }
  .allbtn { display: block; width: max-content; margin: 20px auto 0; font-size: .9rem; color: var(--gold); font-weight: 500; }
  .kbd { text-align: center; color: var(--ink-3); font-size: .76rem; margin-top: 18px; }
  kbd { font: inherit; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }

  .totop { position: fixed; right: 20px; bottom: 20px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--gold); background: var(--surface); cursor: pointer; display: grid; place-items: center; opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .2s, transform .2s; z-index: 25; }
  .totop.show { opacity: 1; transform: none; pointer-events: auto; }
  .totop svg { width: 18px; height: 18px; stroke: var(--gold); }

  .state { padding: 80px 16px; text-align: center; color: var(--ink-3); }
  .state a { color: var(--gold); cursor: pointer; }

  @media (max-width: 900px) {
    .lead .sum { grid-template-columns: 1fr; }
    .lead .sum .aside { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 10px; flex-direction: row; flex-wrap: wrap; gap: 4px 16px; justify-content: flex-start; }
    .lead .sum .aside > div { width: 100%; display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; }
    .lead .sum .aside > div .eyebrow { grid-column: 1 / -1; }
    .lead .sum .aside .row { border-bottom: 1px solid var(--line); padding: 4px 0; }
    .lead .sum .aside .go { width: 100%; }
  }
  @media (max-width: 760px) {
    .wrap { padding: 0 16px; }
    .site nav { gap: 14px; font-size: .85rem; }
    .brand { font-size: 1rem; }
    .hero { padding: 22px 0 14px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 22px; }
    .stat { padding: 8px 10px; } .stat .v { font-size: 1.15rem; }
    .rail { padding: 2px 16px 12px; margin: 0 -16px 24px; scroll-padding: 0 16px; gap: 12px; }
    .chart { flex-basis: 88%; padding: 14px 14px 10px; }
    .chartbox, .chartbox .msg { min-height: 200px; }
    .chartbox svg, .chartbox .msg { height: 200px; }
    .sechead .nav-arrows { display: none; }
    .filters input { width: 100%; }
    .filters { width: 100%; }
    .cards { grid-template-columns: 1fr; gap: 12px; }
    .lead .sum { padding: 18px; }
    .article { padding: 22px 16px 40px; }
    .body { font-size: 1.05rem; }
    .totop { right: 14px; bottom: 14px; }
    .kbd { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } .rail { scroll-behavior: auto; } }
</style>
</head>
<body>

<div class="progress" id="progress" hidden></div>

<header class="site" id="site" hidden>
  <div class="wrap">
    <a class="brand" href="https://point75.io/">Paper &amp; Cadence</a>
    <nav aria-label="Main">
      <a href="https://point75.io/">Journal</a>
      <a href="https://point75.io/news">News</a>
      <a href="#/" aria-current="page">Bond Summary</a>
    </nav>
  </div>
</header>

<main id="app"><div class="state">Loading bond summaries…</div></main>

<button class="totop" id="totop" aria-label="Back to top" title="Back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script>
(function () {
  "use strict";

  // Same origin when served from the Vercel project (or `vercel dev`); absolute URL when
  // this code runs anywhere else, e.g. pasted into point75.io.
  const VERCEL_API = "https://coupon-news-ui.vercel.app";
  const onVercel = /\.vercel\.app$/.test(location.hostname) || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const API = onVercel ? "" : VERCEL_API;

  /* =====================================================================================
     DATA SOURCES AND CHARTS

     SOURCES: where chart data comes from. Each source fetches one /api endpoint and turns
     the response into rows, oldest first:   [{ date: "2026-09-24", KEY1: 4.87, KEY2: 5.18 }, ...]
     The easiest response shape for a new endpoint is the same one /api/yields-ytd uses:
       { "series": { "KEY": { "label": "...", "history": [{ "date": "YYYY-MM-DD", "value": 1.23 }] } } }
     and then toRows is just: json => historyToRows(json.series)

     CHARTS: one entry per chart card, shown left to right in the rail.
       id        unique id
       group     small label on the card, e.g. "Rates" or "Private credit"
       title     card title
       source    key in SOURCES
       unit      "%" (value shown as 4.87%), "bp" (basis points), or "" (plain number)
       decimals  optional, digits after the point (default 2 for %, 0 for bp)
       series    lines to draw: [{ key, label, color }]  (key = a field in the rows)
       derive    optional: row => ({ NEW_KEY: value }) to compute lines, e.g. spreads
       zeroLine  optional: draw a dotted line at 0
       markSummaries  optional: series key to mark days that have a summary (click to read)
       note      optional: source line under the chart

     Example, once a private credit endpoint exists:
       SOURCES.privateCredit = { url: "/api/private-credit", toRows: j => historyToRows(j.series) };
       CHARTS.push({ id: "bdc-spread", group: "Private credit", title: "BDC loan spreads",
                     source: "privateCredit", unit: "bp",
                     series: [{ key: "BDC_SPREAD", label: "Spread over SOFR", color: "var(--s30)" }],
                     note: "Source: ..." });
     ===================================================================================== */
  const SOURCES = {
    treasuries: { url: "/api/yields-ytd", toRows: j => historyToRows(j.yields) },
  };

  const CHARTS = [
    { id: "treasuries", group: "Rates", title: "Treasury yields", source: "treasuries", unit: "%",
      series: [
        { key: "DGS2",  label: "2-year",  color: "var(--s2)" },
        { key: "DGS10", label: "10-year", color: "var(--s10)", bold: true },
        { key: "DGS30", label: "30-year", color: "var(--s30)" },
      ],
      markSummaries: "DGS10", note: "Daily closing yields from FRED" },
    { id: "curve", group: "Rates", title: "Yield curve: 10-year minus 2-year", source: "treasuries", unit: "bp",
      derive: r => (r.DGS10 != null && r.DGS2 != null) ? { CURVE: (r.DGS10 - r.DGS2) * 100 } : null,
      series: [{ key: "CURVE", label: "10Y – 2Y spread", color: "var(--s30)", bold: true }],
      zeroLine: true, note: "Below zero means the curve is inverted" },
  ];

  // A dashed "coming soon" card at the end of the rail. Set to "" to hide it.
  const COMING_SOON = "Private credit charts are on the way.";

  /* ---------- state ---------- */
  const app = document.getElementById("app");
  const progress = document.getElementById("progress");
  const totop = document.getElementById("totop");
  let embedded = false; try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
  document.getElementById("site").hidden = embedded || !onVercel;

  let entries = [];            // [{id, date, key, generated, title, preview, md, text, minutes}] newest first
  const data = {};             // source key -> rows (oldest first), or null if it failed
  let range = "3M";
  let query = "";
  let listScrollY = 0;
  let current = null;

  /* ---------- helpers ---------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const readSet = new Set(store.get("bondsummary:read", []));
  const markRead = id => { readSet.add(id); store.set("bondsummary:read", [...readSet].slice(-200)); };
  range = store.get("bondsummary:range", "3M");

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // "2026-09-25" -> local Date for Sep 25. (new Date("2026-09-25") would be UTC midnight,
  // which displays as Sep 24 in US time zones.)
  const parseDay = s => { const m = String(s || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  const fmtLong = d => d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  const fmtFull = d => d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  const fmtDay = d => d.toLocaleDateString("en-US", { weekday: "short" });
  const fmtShort = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const fmtStamp = ts => new Date(ts).toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short" });

  // { KEY: { history: [{date, value}] }, ... } -> [{date, KEY: value, ...}] oldest first
  function historyToRows(obj) {
    const map = new Map();
    Object.entries(obj || {}).forEach(([key, s]) => ((s && s.history) || []).forEach(h => {
      if (h.value == null || isNaN(h.value)) return;
      if (!map.has(h.date)) map.set(h.date, { date: h.date });
      map.get(h.date)[key] = +h.value;
    }));
    return [...map.values()].sort((a, b) => a.date.localeCompare(b.date));
  }

  function plainText(md) {
    return md.replace(/```[\s\S]*?```/g, " ").replace(/^#+\s.*$/gm, " ")
      .replace(/^\s*(?:[-*+]|\d+\.|>)\s+/gm, "").replace(/[*_`|~]+/g, "")
      .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/\s+/g, " ").trim();
  }

  function renderMarkdown(md) {
    if (window.marked) {
      const html = window.marked.parse(md, { gfm: true, breaks: false });
      return window.DOMPurify ? window.DOMPurify.sanitize(html) : html;
    }
    // Fallback if the CDN is unreachable.
    const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|\W)\*(?!\s)(.+?)\*(?=\W|$)/g, "$1<em>$2</em>");
    return md.split(/\n{2,}/).map(block => {
      const lines = block.split("\n").filter(l => l.trim());
      if (!lines.length) return "";
      const h = lines[0].match(/^(#{1,4})\s+(.*)/);
      if (h) { const lvl = Math.max(2, Math.min(3, h[1].length)); const rest = lines.slice(1).join("\n");
        return `<h${lvl}>${inline(h[2])}</h${lvl}>` + (rest ? renderMarkdown(rest) : ""); }
      if (lines.every(l => /^\s*[-*+]\s/.test(l))) return "<ul>" + lines.map(l => "<li>" + inline(l.replace(/^\s*[-*+]\s/, "")) + "</li>").join("") + "</ul>";
      if (lines.every(l => /^\s*\d+\.\s/.test(l))) return "<ol>" + lines.map(l => "<li>" + inline(l.replace(/^\s*\d+\.\s/, "")) + "</li>").join("") + "</ol>";
      if (lines.every(l => /^\s*>/.test(l))) return "<blockquote><p>" + inline(lines.map(l => l.replace(/^\s*>\s?/, "")).join(" ")) + "</p></blockquote>";
      if (/^(-{3,}|\*{3,})$/.test(block.trim())) return "<hr>";
      return "<p>" + inline(lines.join(" ")) + "</p>";
    }).join("");
  }

  /* ---------- data ---------- */
  function toEntries(list) {
    return list.map(s => {
      const md = String(s.summary || "").replace(/^#\s+.+\n*/, "").trim();
      const text = plainText(md);
      return {
        id: s.market_date, date: parseDay(s.market_date), key: s.key,
        generated: s.generated_at, title: s.title || "Bond market summary",
        preview: s.preview || text.slice(0, 260), md, text,
        minutes: Math.max(1, Math.round(text.split(" ").length / 230))
      };
    }).filter(e => e.date).sort((a, b) => b.date - a.date);
  }

  const treasuryRows = () => data.treasuries || [];

  // Rows for one chart: its source rows, plus any derived fields, limited to the range.
  function chartRows(c) {
    let rows = data[c.source] || [];
    if (c.derive) rows = rows.map(r => { const extra = c.derive(r); return extra ? Object.assign({ date: r.date }, extra) : null; }).filter(Boolean);
    if (!rows.length) return rows;
    const last = parseDay(rows[rows.length - 1].date);
    const from = new Date(last);
    if (range === "1M") from.setMonth(from.getMonth() - 1);
    else if (range === "3M") from.setMonth(from.getMonth() - 3);
    else from.setMonth(0, 1);
    return rows.filter(r => parseDay(r.date) >= from);
  }

  const fmtVal = (c, v) => {
    const dp = c.decimals ?? (c.unit === "bp" ? 0 : 2);
    return c.unit === "%" ? v.toFixed(dp) + "%" : c.unit === "bp" ? v.toFixed(dp) + " bp" : v.toFixed(dp);
  };
  const fmtAxis = (c, v) => {
    const dp = c.unit === "bp" ? 0 : c.decimals ?? 2;
    const s = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(dp);
    return c.unit === "%" ? s + "%" : s;
  };

  /* ---------- latest levels ---------- */
  function statsHTML() {
    const rows = treasuryRows();
    if (!rows.length) return "";
    const last = rows[rows.length - 1], prev = rows[rows.length - 2];
    const stat = (label, v, pv, isSpread) => {
      if (v == null) return "";
      let d = `<div class="d flat">as of ${fmtShort(parseDay(last.date))}</div>`;
      if (pv != null) {
        const bp = Math.round((v - pv) * 100);
        const cls = bp > 0 ? "up" : bp < 0 ? "down" : "flat";
        d = `<div class="d ${cls}">${bp > 0 ? "▲ +" : bp < 0 ? "▼ " : "– "}${bp} bp on the day</div>`;
      }
      return `<div class="stat"><div class="k">${label}</div><div class="v">${isSpread ? Math.round(v * 100) + " bp" : v.toFixed(2) + "%"}</div>${d}</div>`;
    };
    const spread = r => r && r.DGS10 != null && r.DGS2 != null ? r.DGS10 - r.DGS2 : null;
    return `<section class="stats" aria-label="Latest levels">
        ${stat("2-year", last.DGS2, prev && prev.DGS2)}
        ${stat("10-year", last.DGS10, prev && prev.DGS10)}
        ${stat("30-year", last.DGS30, prev && prev.DGS30)}
        ${stat("10Y – 2Y curve", spread(last), spread(prev), true)}
      </section>`;
  }

  /* ---------- chart rail ---------- */
  function railHTML() {
    const cards = CHARTS.map(c => `
      <article class="card chart" id="chart-${esc(c.id)}" aria-label="${esc(c.title)}">
        <div class="chart-head"><h3>${esc(c.title)}</h3>${c.group ? `<span class="group">${esc(c.group)}</span>` : ""}</div>
        <div class="legend">
          ${c.series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join("")}
          ${c.markSummaries && entries.length ? `<span><span class="dotkey"></span>Day with a summary</span>` : ""}
        </div>
        <div class="chartbox" data-chart="${esc(c.id)}"></div>
        <div class="source" data-source="${esc(c.id)}"></div>
      </article>`).join("");
    const soon = COMING_SOON ? `<article class="card chart soon" aria-label="More charts coming"><span class="eyebrow">Coming soon</span><p>${esc(COMING_SOON)}</p></article>` : "";
    const total = CHARTS.length;
    return `
      <div class="sechead">
        <h2>Charts</h2>
        <div class="tools">
          <div class="seg" role="group" aria-label="Chart range">
            ${["1M", "3M", "YTD"].map(r => `<button data-range="${r}" aria-pressed="${r === range}">${r}</button>`).join("")}
          </div>
          <span class="nav-arrows" ${total < 2 ? "hidden" : ""}>
            <button class="iconbtn" id="railPrev" aria-label="Previous chart"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
            <button class="iconbtn" id="railNext" aria-label="Next chart"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
          </span>
          <span class="count" id="railCount"></span>
        </div>
      </div>
      <div class="rail" id="rail" tabindex="0" aria-label="Charts, scroll sideways for more">${cards}${soon}</div>`;
  }

  function drawAllCharts() { CHARTS.forEach(drawChart); updateRailNav(); }

  function drawChart(c) {
    const box = app.querySelector(`.chartbox[data-chart="${c.id}"]`);
    const src = app.querySelector(`.source[data-source="${c.id}"]`);
    if (!box) return;
    if (data[c.source] === null) { box.innerHTML = `<div class="msg">This chart's data didn't load. It'll try again on your next visit.</div>`; return; }
    const pts = chartRows(c);
    if (!pts.length) { box.innerHTML = `<div class="msg">No data yet.</div>`; return; }
    if (src) src.textContent = (c.note ? c.note + ". " : "") + `Latest ${fmtFull(parseDay(pts[pts.length - 1].date))}.`;

    const summaryDays = new Set(entries.map(e => e.id));
    const W = box.clientWidth || 520, H = window.innerWidth < 760 ? 200 : 220;
    const m = { t: 12, r: 12, b: 26, l: c.unit === "%" ? 46 : 40 };
    const vals = pts.flatMap(p => c.series.map(s => p[s.key])).filter(v => v != null);
    if (c.zeroLine) vals.push(0);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = Math.max(c.unit === "bp" ? 2 : 0.05, (hi - lo) * 0.08); lo -= pad; hi += pad;
    // Round gridlines to tidy steps (e.g. 0.25%, 10 bp)
    const raw = (hi - lo) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
    const tick = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
    lo = Math.floor(lo / tick) * tick; hi = Math.ceil(hi / tick) * tick;
    const x = i => pts.length === 1 ? (m.l + W - m.r) / 2 : m.l + i * (W - m.l - m.r) / (pts.length - 1);
    const y = v => m.t + (hi - v) * (H - m.t - m.b) / (hi - lo);

    const grid = [];
    for (let v = lo; v <= hi + tick / 2; v += tick) {
      grid.push(`<line x1="${m.l}" x2="${W - m.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>`,
                `<text x="${m.l - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${fmtAxis(c, v)}</text>`);
    }
    const zero = c.zeroLine && lo < 0 && hi > 0 ? `<line class="zero" x1="${m.l}" x2="${W - m.r}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"/>` : "";
    const maxLabels = Math.max(2, Math.floor((W - m.l - m.r) / 70));
    const step = Math.max(1, Math.ceil(pts.length / maxLabels));
    const xl = pts.map((p, i) => {
      const lastIdx = pts.length - 1;
      const show = i === lastIdx || (i % step === 0 && x(lastIdx) - x(i) >= 64);
      return show ? `<text x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="${i === lastIdx ? "end" : i === 0 ? "start" : "middle"}">${fmtShort(parseDay(p.date))}</text>` : "";
    }).join("");

    const lines = c.series.map(s => {
      const seg = pts.map((p, i) => p[s.key] == null ? null : [x(i), y(p[s.key])]).filter(Boolean);
      if (!seg.length) return "";
      const d = seg.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" ");
      const lastPt = seg[seg.length - 1];
      return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.bold ? 2.25 : 1.6}" stroke-linejoin="round" stroke-linecap="round"/>
              <circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="3.5" fill="${s.color}"/>`;
    }).join("");

    const mk = c.markSummaries;
    const marks = mk ? pts.map((p, i) => summaryDays.has(p.date) && p[mk] != null
      ? `<circle cx="${x(i).toFixed(1)}" cy="${y(p[mk]).toFixed(1)}" r="4.5" fill="var(--surface)" stroke="var(--gold)" stroke-width="2"/>` : "").join("") : "";

    box.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}, line chart">
        <g class="grid axis">${grid.join("")}</g>${zero}
        <g class="axis">${xl}</g>
        <line class="hoverline" y1="${m.t}" y2="${H - m.b}" stroke="var(--ink-3)" stroke-dasharray="3 3" opacity="0"/>
        ${lines}${marks}
        <rect class="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H - m.b}" fill="transparent"/>
      </svg>
      <div class="tip"></div>`;
    box.querySelector("svg").style.height = H + "px";

    const hit = box.querySelector(".hit"), tip = box.querySelector(".tip"), hl = box.querySelector(".hoverline");
    const nearest = ev => {
      const r = box.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
      let best = 0; pts.forEach((p, i) => { if (Math.abs(x(i) - px) < Math.abs(x(best) - px)) best = i; });
      return best;
    };
    const show = ev => {
      const i = nearest(ev), p = pts[i], r = box.getBoundingClientRect();
      const has = mk && summaryDays.has(p.date);
      hl.setAttribute("x1", x(i)); hl.setAttribute("x2", x(i)); hl.setAttribute("opacity", 1);
      tip.innerHTML = `<b>${fmtFull(parseDay(p.date))}</b><br>` +
        c.series.filter(s => p[s.key] != null).map(s => `${esc(s.label)} ${fmtVal(c, p[s.key])}`).join(" · ") +
        (has ? `<br><span class="open">Click to read that day's summary</span>` : "");
      const left = Math.min(Math.max(x(i) * r.width / W, 110), r.width - 110);
      tip.style.left = left + "px";
      tip.style.top = (y(Math.max(...c.series.map(s => p[s.key] ?? lo))) * r.height / H) + "px";
      tip.style.opacity = 1;
      hit.style.cursor = has ? "pointer" : "default";
    };
    const hide = () => { tip.style.opacity = 0; hl.setAttribute("opacity", 0); };
    hit.addEventListener("mousemove", show);
    hit.addEventListener("mouseleave", hide);
    hit.addEventListener("click", ev => { const p = pts[nearest(ev)]; if (mk && summaryDays.has(p.date)) location.hash = "#/" + p.date; else show(ev); });
  }

  // Arrows and "1 of 3" for the rail
  function railStep() { const r = document.getElementById("rail"), card = r && r.querySelector(".chart"); return card ? card.getBoundingClientRect().width + 16 : 300; }
  function updateRailNav() {
    const r = document.getElementById("rail"); if (!r) return;
    const cards = [...r.querySelectorAll(".chart:not(.soon)")];
    const prev = document.getElementById("railPrev"), next = document.getElementById("railNext"), count = document.getElementById("railCount");
    const max = r.scrollWidth - r.clientWidth - 2;
    if (prev) prev.disabled = r.scrollLeft <= 2;
    if (next) next.disabled = r.scrollLeft >= max;
    if (count && cards.length > 1) {
      const rl = r.getBoundingClientRect().left;
      let first = cards.findIndex(c => c.getBoundingClientRect().right > rl + 40);
      if (first < 0) first = cards.length - 1;
      const visible = cards.filter(c => { const b = c.getBoundingClientRect(); return b.left >= rl - 4 && b.right <= r.getBoundingClientRect().right + 4; }).length || 1;
      const lastShown = Math.min(cards.length, first + visible);
      count.textContent = visible > 1 && lastShown > first + 1 ? `${first + 1}–${lastShown} of ${cards.length}` : `${first + 1} of ${cards.length}`;
    } else if (count) count.textContent = "";
  }

  /* ---------- summaries ---------- */
  function filtered() {
    const q = query.trim().toLowerCase();
    return q ? entries.filter(e => e.title.toLowerCase().includes(q) || e.text.toLowerCase().includes(q)) : entries;
  }

  function cardsHTML() {
    const rows = filtered();
    if (!rows.length) return `<li class="empty">${entries.length ? "No summaries match your search." : "No summaries yet. The first one will appear after the next run."}</li>`;
    return rows.map((e, n) => {
      const isLatest = e === entries[0], isRead = readSet.has(e.id) && !isLatest;
      const lead = isLatest && n === 0 && !query.trim();
      const tags = `<div class="tags">
          ${isLatest ? '<span class="tag solid">Latest</span>' : ""}
          <span class="tag">${fmtShort(e.date)}</span>
          ${isRead ? '<span class="tag muted">Read</span>' : ""}
          <span class="when">${fmtDay(e.date)} · ${e.minutes} min read</span>
        </div>`;
      if (lead) {
        // Closing levels for that day, or the most recent close before it (FRED posts a day late)
        const r = [...treasuryRows()].reverse().find(row => row.date <= e.id);
        const lvl = r ? [["2-year", r.DGS2], ["10-year", r.DGS10], ["30-year", r.DGS30]].filter(q => q[1] != null)
          .map(q => `<div class="row"><span>${q[0]}</span><b>${q[1].toFixed(2)}%</b></div>`).join("") +
          (r.DGS10 != null && r.DGS2 != null ? `<div class="row"><span>10Y – 2Y</span><b>${Math.round((r.DGS10 - r.DGS2) * 100)} bp</b></div>` : "") : "";
        return `<li class="lead"><a class="card sum" href="#/${e.id}">
            <div class="main">${tags}<h3>${esc(e.title)}</h3><p>${esc(e.preview)}</p></div>
            <div class="aside">${lvl ? `<div><div class="eyebrow" style="margin-bottom:4px">Close on ${fmtShort(parseDay(r.date))}</div>${lvl}</div>` : "<div></div>"}<span class="go">Read the summary →</span></div>
          </a></li>`;
      }
      return `<li><a class="card sum${isRead ? " read" : ""}" href="#/${e.id}">
          ${tags}<h3>${esc(e.title)}</h3><p>${esc(e.preview)}</p><span class="go">Read →</span>
        </a></li>`;
    }).join("");
  }

  function renderList() {
    document.title = "Bond Summary | Point75";
    progress.hidden = true;
    app.innerHTML = `
      <div class="wrap">
        <section class="hero">
          <div>
            <div class="eyebrow">Daily bond market summary</div>
            <h1>Bond Summary</h1>
            <p>${entries.length ? `Latest covers trading on ${fmtFull(entries[0].date)}` : ""}</p>
          </div>
        </section>
        ${statsHTML()}
        ${railHTML()}
        <div class="sechead">
          <h2>Summaries</h2>
          ${entries.length > 6 ? `<div class="filters"><input type="search" id="q" placeholder="Search summaries" value="${esc(query)}" aria-label="Search summaries"></div>` : ""}
        </div>
        <ul class="cards" id="cards">${cardsHTML()}</ul>
      </div>`;
    drawAllCharts();

    const rail = document.getElementById("rail");
    rail.addEventListener("scroll", () => requestAnimationFrame(updateRailNav), { passive: true });
    const prev = document.getElementById("railPrev"), next = document.getElementById("railNext");
    if (prev) prev.addEventListener("click", () => rail.scrollBy({ left: -railStep(), behavior: "smooth" }));
    if (next) next.addEventListener("click", () => rail.scrollBy({ left: railStep(), behavior: "smooth" }));
    rail.addEventListener("keydown", ev => {
      if (ev.key === "ArrowRight") { rail.scrollBy({ left: railStep(), behavior: "smooth" }); ev.preventDefault(); }
      if (ev.key === "ArrowLeft") { rail.scrollBy({ left: -railStep(), behavior: "smooth" }); ev.preventDefault(); }
    });

    const q = document.getElementById("q");
    if (q) q.addEventListener("input", () => { query = q.value; document.getElementById("cards").innerHTML = cardsHTML(); });
    app.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
      range = b.dataset.range; store.set("bondsummary:range", range);
      app.querySelectorAll(".seg button").forEach(o => o.setAttribute("aria-pressed", o === b));
      drawAllCharts();
    }));
  }

  /* ---------- article view ---------- */
  function renderArticle(e) {
    const i = entries.indexOf(e);
    const newer = entries[i - 1], older = entries[i + 1];
    document.title = e.title + " | Bond Summary";
    markRead(e.id);

    const r = [...treasuryRows()].reverse().find(row => row.date <= e.id);
    const snap = r ? `<div class="snap"><span>Close on ${fmtShort(parseDay(r.date))}:</span>` +
      [["2Y", r.DGS2], ["10Y", r.DGS10], ["30Y", r.DGS30]].filter(q => q[1] != null).map(q => `<span>${q[0]} <b>${q[1].toFixed(2)}%</b></span>`).join("") +
      (r.DGS10 != null && r.DGS2 != null ? `<span>10Y–2Y <b>${Math.round((r.DGS10 - r.DGS2) * 100)} bp</b></span>` : "") + `</div>` : "";

    app.innerHTML = `
      <div class="stickybar" id="stickybar"><div class="wrap">
        <a class="back" href="#/">← All summaries</a>
        <span class="crumb">${fmtLong(e.date)}</span>
      </div></div>
      <article class="article">
        <div class="eyebrow">Bond market summary · ${fmtLong(e.date)}</div>
        <h1>${esc(e.title)}</h1>
        <div class="meta">Covers trading on ${fmtFull(e.date)} · ${e.minutes} min read${e.generated ? ` · Published ${fmtStamp(e.generated)}` : ""}</div>
        ${snap}
        <ul class="toc" id="toc" hidden></ul>
        <div class="body" id="body">${renderMarkdown(e.md)}</div>
        <nav class="pager" aria-label="More summaries">
          ${older ? `<a href="#/${older.id}"><div class="lbl">← Previous · ${fmtShort(older.date)}</div><div class="t">${esc(older.title)}</div></a>` : "<span></span>"}
          ${newer ? `<a class="next" href="#/${newer.id}"><div class="lbl">Next · ${fmtShort(newer.date)} →</div><div class="t">${esc(newer.title)}</div></a>` : ""}
        </nav>
        <a class="allbtn" href="#/">Back to all summaries</a>
        <div class="kbd"><kbd>←</kbd> <kbd>→</kbd> previous / next · <kbd>Esc</kbd> all summaries</div>
      </article>`;

    const heads = [...document.querySelectorAll("#body h2")];
    if (heads.length >= 2) {
      const toc = document.getElementById("toc");
      toc.innerHTML = heads.map((h, n) => `<li><button data-n="${n}">${esc(h.textContent)}</button></li>`).join("");
      toc.hidden = false;
      toc.addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) heads[+b.dataset.n].scrollIntoView({ block: "start" }); });
    }
    progress.hidden = false;
    onScroll();
  }

  /* ---------- router ---------- */
  function route() {
    const id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    const e = id && entries.find(x => x.id === id || x.key === id);   // old run-date links still work
    if (e) {
      if (current === "list") listScrollY = window.scrollY;
      renderArticle(e);
      window.scrollTo({ top: 0, behavior: "instant" });
      current = e.id;
    } else {
      const fromArticle = current && current !== "list";
      renderList();
      window.scrollTo({ top: fromArticle ? listScrollY : 0, behavior: "instant" });
      current = "list";
    }
  }

  /* ---------- scroll & keys ---------- */
  function onScroll() {
    const y = window.scrollY, max = document.documentElement.scrollHeight - innerHeight;
    totop.classList.toggle("show", y > 500);
    if (!progress.hidden) progress.style.width = (max > 0 ? Math.min(100, y / max * 100) : 100) + "%";
    const sb = document.getElementById("stickybar"); if (sb) sb.classList.toggle("scrolled", y > 10);
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  totop.addEventListener("click", () => window.scrollTo({ top: 0 }));
  let rT; window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { if (current === "list") drawAllCharts(); }, 150); });
  window.addEventListener("hashchange", route);
  document.addEventListener("keydown", ev => {
    if (ev.target.closest("input, select, textarea, .rail") || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (!current || current === "list") return;
    const i = entries.findIndex(e => e.id === current);
    if (ev.key === "Escape") location.hash = "#/";
    else if (ev.key === "ArrowLeft" && entries[i + 1]) location.hash = "#/" + entries[i + 1].id;
    else if (ev.key === "ArrowRight" && entries[i - 1]) location.hash = "#/" + entries[i - 1].id;
  });

  /* ---------- load ---------- */
  const getJSON = url => fetch(url, { cache: "no-store" }).then(r => r.ok ? r.json() : Promise.reject(new Error(url + " → " + r.status)));

  function load() {
    app.innerHTML = `<div class="state">Loading bond summaries…</div>`;
    const srcKeys = Object.keys(SOURCES);
    Promise.allSettled([getJSON(API + "/api/bondsummary-list"), ...srcKeys.map(k => getJSON(API + SOURCES[k].url))])
      .then(([list, ...srcs]) => {
        srcs.forEach((s, n) => {
          const k = srcKeys[n];
          try { data[k] = s.status === "fulfilled" ? SOURCES[k].toRows(s.value) : null; }
          catch (err) { data[k] = null; console.warn("Chart source failed:", k, err); }
          if (s.status !== "fulfilled") console.warn("Chart source unavailable:", k, s.reason);
        });
        if (list.status !== "fulfilled") throw list.reason;
        entries = toEntries(list.value.summaries || []);
        current = null;
        route();
      })
      .catch(err => {
        console.error("Could not load bond summaries", err);
        app.innerHTML = `<div class="state">Couldn't load the bond summaries right now. <a id="retry">Try again</a></div>`;
        document.getElementById("retry").addEventListener("click", load);
      });
  }
  load();
})();
</script>
</body>
</html>
