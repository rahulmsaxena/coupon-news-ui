<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coupon — rates, debt & the politics that move them</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #0F1B2D;
    --ink-raised: #142236;
    --paper: #F2EFE9;
    --paper-dim: #C9D2DD;
    --slate: #7C8FA3;
    --rule: #26374F;
    --gold: #C9A227;
    --err: #C1554A;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--serif);
  }

  body{
    min-height: 100vh;
  }

  a{ color: inherit; }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 5rem;
  }

  /* Masthead */
  header.masthead{
    border-bottom: 2px solid var(--gold);
    padding-bottom: 1.1rem;
    margin-bottom: 1.5rem;
  }
  .masthead-row{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .masthead-title{
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0;
  }
  .masthead-meta{
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--slate);
    text-align: right;
  }
  .masthead-tagline{
    margin: 0.5rem 0 0;
    color: var(--paper-dim);
    font-size: 1rem;
    font-style: italic;
    max-width: 46ch;
  }

  /* Market snapshot */
  .snapshot{
    border-left: 2px solid var(--gold);
    padding: 0.9rem 0 0.9rem 1rem;
    margin-bottom: 2rem;
  }
  .snapshot-narrative{
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 0 0 0.7rem;
  }
  .snapshot-yields{
    display:flex;
    flex-wrap: wrap;
    gap: 1.2rem;
    font-family: var(--mono);
    font-size: 0.8rem;
    margin-bottom: 0.6rem;
  }
  .snapshot-yields .yield-item .label{ color: var(--slate); }
  .snapshot-yields .yield-item .value{ color: var(--paper); }
  .snapshot-yields .yield-item .up{ color: #8FAE6E; }
  .snapshot-yields .yield-item .down{ color: var(--err); }
  .snapshot-attribution{
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--slate);
    margin: 0;
  }

  /* Controls */
  .controls{
    display:flex;
    flex-wrap: wrap;
    gap: 0.6rem 0.8rem;
    align-items: center;
    margin-bottom: 1.75rem;
    font-family: var(--mono);
    font-size: 0.78rem;
  }
  .controls select, .controls input[type="search"]{
    background: var(--ink-raised);
    border: 1px solid var(--rule);
    color: var(--paper);
    font-family: var(--mono);
    font-size: 0.78rem;
    padding: 0.4rem 0.6rem;
    border-radius: 2px;
  }
  .controls select:focus, .controls input:focus, button:focus{
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }
  .controls input[type="search"]{
    flex: 1 1 160px;
    min-width: 140px;
  }
  button.refresh{
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--paper-dim);
    font-family: var(--mono);
    font-size: 0.78rem;
    padding: 0.4rem 0.7rem;
    border-radius: 2px;
    cursor: pointer;
  }
  button.refresh:hover{
    border-color: var(--gold);
    color: var(--gold);
  }
  .count{
    color: var(--slate);
    margin-left: auto;
  }

  /* Article list */
  ul.feed{
    list-style: none;
    margin: 0; padding: 0;
  }
  li.article{
    padding: 1.4rem 0;
    border-bottom: 1px solid var(--rule);
  }
  li.article:first-child{ padding-top: 0; }

  .article-meta{
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--slate);
    display:flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    margin-bottom: 0.4rem;
    text-transform: none;
  }
  .article-meta .region{ color: var(--gold); }

  .article h2{
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.35;
    margin: 0 0 0.4rem;
  }
  .article h2 a{
    text-decoration: none;
  }
  .article h2 a:hover{
    text-decoration: underline;
    text-decoration-color: var(--gold);
  }
  .article p.summary{
    color: var(--paper-dim);
    font-size: 0.95rem;
    line-height: 1.55;
    margin: 0;
    max-width: 68ch;
  }

  /* States */
  .state{
    padding: 3rem 0;
    text-align: center;
    color: var(--slate);
    font-family: var(--mono);
    font-size: 0.85rem;
  }
  .state.error{ color: var(--err); }
  .state a.retry{
    display:inline-block;
    margin-top: 0.8rem;
    color: var(--gold);
    cursor: pointer;
  }

  footer{
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--slate);
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div class="masthead-row">
        <h1 class="masthead-title">Coupon</h1>
        <div class="masthead-meta" id="generated-at">loading —</div>
      </div>
      <p class="masthead-tagline">A daily briefing on rates, sovereign debt, and the politics that move them.</p>
    </header>

    <section class="snapshot" id="market-snapshot" hidden></section>

    <div class="controls">
      <select id="date-select" aria-label="Select date"></select>
      <select id="region-select" aria-label="Filter by region"></select>
      <select id="source-select" aria-label="Filter by source"></select>
      <input type="search" id="search-input" placeholder="Search headlines…" aria-label="Search headlines" />
      <button class="refresh" id="refresh-btn" type="button">Refresh</button>
      <span class="count" id="result-count"></span>
    </div>

    <div id="content">
      <div class="state" id="initial-state">Loading today's briefing —</div>
    </div>

    <footer>
      Sources: central bank press releases, Marketaux, NewsData.io. Updated once daily.
    </footer>
  </div>

<script>
(function () {
  const state = {
    articles: [],
    generatedAt: null,
    date: null,
    dates: [],
    filters: { region: "all", source: "all", query: "" },
  };

  const el = {
    content: document.getElementById("content"),
    generatedAt: document.getElementById("generated-at"),
    dateSelect: document.getElementById("date-select"),
    regionSelect: document.getElementById("region-select"),
    sourceSelect: document.getElementById("source-select"),
    searchInput: document.getElementById("search-input"),
    refreshBtn: document.getElementById("refresh-btn"),
    resultCount: document.getElementById("result-count"),
  };

  function fmtRelative(iso) {
    try {
      const then = new Date(iso).getTime();
      const now = Date.now();
      const diffMin = Math.round((now - then) / 60000);
      if (diffMin < 1) return "just now";
      if (diffMin < 60) return diffMin + "m ago";
      const diffHr = Math.round(diffMin / 60);
      if (diffHr < 24) return diffHr + "h ago";
      const diffDay = Math.round(diffHr / 24);
      return diffDay + "d ago";
    } catch (e) {
      return "";
    }
  }

  function renderMeta() {
    if (state.generatedAt) {
      const d = new Date(state.generatedAt);
      el.generatedAt.textContent = "updated " + d.toUTCString().slice(0, 22) + " UTC";
    } else {
      el.generatedAt.textContent = "";
    }
  }

  function populateFilterOptions() {
    const regions = new Set(["all"]);
    const sources = new Set(["all"]);
    state.articles.forEach(a => {
      if (a.region) regions.add(a.region);
      if (a.source) sources.add(a.source);
    });

    function fill(select, values, currentValue, allLabel) {
      select.innerHTML = "";
      Array.from(values).forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v === "all" ? allLabel : v;
        if (v === currentValue) opt.selected = true;
        select.appendChild(opt);
      });
    }

    fill(el.regionSelect, regions, state.filters.region, "All regions");
    fill(el.sourceSelect, sources, state.filters.source, "All sources");
  }

  function populateDateOptions() {
    el.dateSelect.innerHTML = "";
    if (state.dates.length === 0) {
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "latest";
      el.dateSelect.appendChild(opt);
      return;
    }
    state.dates.forEach((d, i) => {
      const opt = document.createElement("option");
      opt.value = d;
      opt.textContent = i === 0 ? d + " (latest)" : d;
      if (d === state.date) opt.selected = true;
      el.dateSelect.appendChild(opt);
    });
  }

  function applyFiltersAndRender() {
    const q = state.filters.query.trim().toLowerCase();
    const filtered = state.articles.filter(a => {
      if (state.filters.region !== "all" && a.region !== state.filters.region) return false;
      if (state.filters.source !== "all" && a.source !== state.filters.source) return false;
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    el.resultCount.textContent = filtered.length + " / " + state.articles.length;

    if (filtered.length === 0) {
      el.content.innerHTML = '<div class="state">No articles match these filters. <a class="retry" id="clear-filters">Clear filters</a></div>';
      const clearBtn = document.getElementById("clear-filters");
      if (clearBtn) clearBtn.addEventListener("click", clearFilters);
      return;
    }

    const ul = document.createElement("ul");
    ul.className = "feed";
    filtered.forEach(a => {
      const li = document.createElement("li");
      li.className = "article";

      const meta = document.createElement("div");
      meta.className = "article-meta";
      meta.innerHTML =
        '<span class="region">' + escapeHtml(a.region || "Global") + '</span>' +
        '<span>' + escapeHtml(a.source || "") + '</span>' +
        '<span>' + fmtRelative(a.published_at) + '</span>';

      const h2 = document.createElement("h2");
      const link = document.createElement("a");
      link.href = a.url || "#";
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = a.title;
      h2.appendChild(link);

      const p = document.createElement("p");
      p.className = "summary";
      p.textContent = a.summary || "";

      li.appendChild(meta);
      li.appendChild(h2);
      if (a.summary) li.appendChild(p);
      ul.appendChild(li);
    });

    el.content.innerHTML = "";
    el.content.appendChild(ul);
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  function clearFilters() {
    state.filters = { region: "all", source: "all", query: "" };
    el.searchInput.value = "";
    populateFilterOptions();
    applyFiltersAndRender();
  }

  async function loadDates() {
    try {
      const resp = await fetch("/api/dates");
      if (!resp.ok) return;
      const data = await resp.json();
      state.dates = data.dates || [];
      populateDateOptions();
    } catch (e) {
      // Non-fatal - date picker just won't populate.
    }
  }

  function renderMarketSnapshot(snapshot) {
    const el2 = document.getElementById("market-snapshot");
    if (!snapshot || !snapshot.narrative) {
      el2.hidden = true;
      el2.innerHTML = "";
      return;
    }

    const yields = snapshot.yields || {};
    const yieldItems = Object.values(yields).map(y => {
      const dir1d = y.change_1d_bps > 0 ? "up" : y.change_1d_bps < 0 ? "down" : "";
      const sign1d = y.change_1d_bps > 0 ? "+" : "";
      return (
        '<span class="yield-item">' +
        '<span class="label">' + escapeHtml(y.label) + '</span> ' +
        '<span class="value">' + y.value.toFixed(2) + '%</span> ' +
        '<span class="' + dir1d + '">' + sign1d + y.change_1d_bps.toFixed(0) + 'bp</span>' +
        '</span>'
      );
    }).join("");

    el2.hidden = false;
    el2.innerHTML =
      '<p class="snapshot-narrative">' + escapeHtml(snapshot.narrative) + '</p>' +
      (yieldItems ? '<div class="snapshot-yields">' + yieldItems + '</div>' : '') +
      (snapshot.attribution ? '<p class="snapshot-attribution">' + escapeHtml(snapshot.attribution) + '</p>' : '');
  }

  async function loadNews(date) {
    el.content.innerHTML = '<div class="state">Loading briefing —</div>';
    try {
      const url = date ? "/api/news?date=" + encodeURIComponent(date) : "/api/news";
      const resp = await fetch(url);
      const data = await resp.json();

      if (!resp.ok) {
        showError(data.error || "Something went wrong loading the briefing.", data.detail);
        return;
      }

      state.articles = data.articles || [];
      state.generatedAt = data.generated_at || null;
      state.date = data.date || date || null;

      renderMeta();
      renderMarketSnapshot(data.market_snapshot);
      populateFilterOptions();
      populateDateOptions();
      applyFiltersAndRender();
    } catch (e) {
      showError("Couldn't reach the briefing service.", String(e));
    }
  }

  function showError(message, detail) {
    document.getElementById("market-snapshot").hidden = true;
    el.content.innerHTML =
      '<div class="state error">' + escapeHtml(message) +
      (detail ? '<br><span style="opacity:0.7">' + escapeHtml(detail) + '</span>' : '') +
      '<br><a class="retry" id="retry-link">Try again</a></div>';
    const retry = document.getElementById("retry-link");
    if (retry) retry.addEventListener("click", () => loadNews(state.date));
  }

  el.regionSelect.addEventListener("change", e => {
    state.filters.region = e.target.value;
    applyFiltersAndRender();
  });
  el.sourceSelect.addEventListener("change", e => {
    state.filters.source = e.target.value;
    applyFiltersAndRender();
  });
  el.searchInput.addEventListener("input", e => {
    state.filters.query = e.target.value;
    applyFiltersAndRender();
  });
  el.dateSelect.addEventListener("change", e => {
    const d = e.target.value;
    state.filters = { region: "all", source: "all", query: "" };
    el.searchInput.value = "";
    loadNews(d || null);
  });
  el.refreshBtn.addEventListener("click", () => loadNews(state.date));

  loadDates();
  loadNews(null);
})();
</script>
</body>
</html>
