<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coupon — rates, debt & the politics that move them</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0F1A;
    --bg-raised: #111A29;
    --panel-border: #22314A;
    --paper: #ECE7DD;
    --paper-dim: #C3CAD6;
    --dim: #7E8CA3;
    --gold: #F2B705;
    --gold-dim: #B98D1D;
    --up: #33D17A;
    --down: #FF5C5C;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; background: var(--bg); color: var(--paper); font-family: var(--serif); }
  body{ min-height: 100vh; }
  a{ color: inherit; }

  .wrap{ max-width: 800px; margin: 0 auto; padding: 2.25rem 1.25rem 5rem; }

  /* Masthead */
  header.masthead{
    display:flex; align-items: baseline; justify-content: space-between;
    gap: 1rem; flex-wrap: wrap;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 1rem; margin-bottom: 1.5rem;
  }
  .masthead-title{
    font-size: 1.9rem; font-weight: 700; letter-spacing: 0.01em; margin: 0;
    color: var(--paper);
  }
  .masthead-title .dot{ color: var(--gold); }
  .masthead-meta{ font-family: var(--mono); font-size: 0.75rem; color: var(--dim); text-align: right; }

  /* Hero: yield snapshot */
  .hero{
    background: var(--bg-raised);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 1.5rem 1.5rem 1.25rem;
    margin-bottom: 2rem;
  }
  .hero-primary{
    display:flex; align-items: flex-end; justify-content: space-between;
    gap: 1.5rem; flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .hero-primary-stat .tenor-label{
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.04em;
    color: var(--gold); margin-bottom: 0.3rem;
  }
  .hero-primary-stat .value-row{ display:flex; align-items: baseline; gap: 0.6rem; }
  .hero-primary-stat .big-value{
    font-family: var(--mono); font-weight: 600; font-size: 3rem; line-height: 1;
    color: var(--paper);
  }
  .hero-primary-stat .delta{ font-family: var(--mono); font-size: 1rem; font-weight: 500; }
  .hero-primary-stat .delta.up{ color: var(--up); }
  .hero-primary-stat .delta.down{ color: var(--down); }
  .hero-primary-stat .delta.flat{ color: var(--dim); }
  .hero-primary-stat .weekly{
    font-family: var(--mono); font-size: 0.75rem; color: var(--dim); margin-top: 0.35rem;
  }
  .hero-chart{ flex: 1 1 220px; max-width: 320px; }
  .sparkline{ width: 100%; height: 64px; display:block; }

  .hero-narrative{
    font-size: 1.05rem; line-height: 1.6; color: var(--paper-dim);
    margin: 0.75rem 0 1.1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--panel-border);
  }

  .hero-secondary{
    display:flex; gap: 1rem; flex-wrap: wrap;
    margin-bottom: 0.9rem;
  }
  .mini-stat{
    flex: 1 1 160px;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 3px;
    padding: 0.7rem 0.85rem;
  }
  .mini-stat .tenor-label{
    font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.04em;
    color: var(--dim); margin-bottom: 0.25rem;
  }
  .mini-stat .value-row{ display:flex; align-items: baseline; gap: 0.5rem; margin-bottom: 0.4rem; }
  .mini-stat .value{ font-family: var(--mono); font-size: 1.3rem; font-weight: 600; color: var(--paper); }
  .mini-stat .delta{ font-family: var(--mono); font-size: 0.8rem; }
  .mini-stat .delta.up{ color: var(--up); }
  .mini-stat .delta.down{ color: var(--down); }
  .mini-stat .delta.flat{ color: var(--dim); }
  .mini-stat .sparkline{ height: 32px; }

  .hero-attribution{
    font-family: var(--mono); font-size: 0.65rem; color: var(--dim); margin: 0;
  }
  .hero-attribution a{ color: var(--dim); }

  .hero-unavailable{
    font-family: var(--mono); font-size: 0.85rem; color: var(--dim);
  }

  /* Controls */
  .controls{
    display:flex; flex-wrap: wrap; gap: 0.6rem 0.8rem; align-items: center;
    margin-bottom: 1.5rem; font-family: var(--mono); font-size: 0.78rem;
  }
  .controls select, .controls input[type="search"]{
    background: var(--bg-raised); border: 1px solid var(--panel-border); color: var(--paper);
    font-family: var(--mono); font-size: 0.78rem; padding: 0.4rem 0.6rem; border-radius: 2px;
  }
  .controls select:focus, .controls input:focus, button:focus{
    outline: 2px solid var(--gold); outline-offset: 1px;
  }
  .controls input[type="search"]{ flex: 1 1 160px; min-width: 140px; }
  button.refresh{
    background: transparent; border: 1px solid var(--panel-border); color: var(--paper-dim);
    font-family: var(--mono); font-size: 0.78rem; padding: 0.4rem 0.7rem; border-radius: 2px; cursor: pointer;
  }
  button.refresh:hover{ border-color: var(--gold); color: var(--gold); }
  .count{ color: var(--dim); margin-left: auto; }

  /* Article list */
  ul.feed{ list-style: none; margin: 0; padding: 0; }
  li.article{ padding: 1.3rem 0; border-bottom: 1px solid var(--panel-border); }
  li.article:first-child{ padding-top: 0; }
  .article-meta{
    font-family: var(--mono); font-size: 0.72rem; color: var(--dim);
    display:flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.4rem;
  }
  .article-meta .region{ color: var(--gold); }
  .article h2{ font-size: 1.12rem; font-weight: 600; line-height: 1.35; margin: 0 0 0.4rem; }
  .article h2 a{ text-decoration: none; }
  .article h2 a:hover{ text-decoration: underline; text-decoration-color: var(--gold); }
  .article p.summary{ color: var(--paper-dim); font-size: 0.94rem; line-height: 1.6; margin: 0; text-align: justify; hyphens: auto; }

  /* States */
  .state{ padding: 3rem 0; text-align: center; color: var(--dim); font-family: var(--mono); font-size: 0.85rem; }
  .state.error{ color: var(--down); }
  .state a.retry{ display:inline-block; margin-top: 0.8rem; color: var(--gold); cursor: pointer; }

  footer{
    margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--panel-border);
    font-family: var(--mono); font-size: 0.72rem; color: var(--dim);
  }

  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <h1 class="masthead-title">Coupon<span class="dot">.</span></h1>
      <div class="masthead-meta" id="generated-at">loading —</div>
    </header>

    <section id="market-snapshot"></section>

    <div class="controls">
      <select id="date-select" aria-label="Select date"></select>
      <select id="region-select" aria-label="Filter by region"></select>
      <select id="source-select" aria-label="Filter by source"></select>
      <input type="search" id="search-input" placeholder="Search headlines…" aria-label="Search headlines" />
      <button class="refresh" id="refresh-btn" type="button">Refresh</button>
      <span class="count" id="result-count"></span>
    </div>

    <div id="content">
      <div class="state" id="initial-state">Loading today's briefing —</div>
    </div>

    <footer>
      Sources: central bank press releases, Marketaux, NewsData.io. Yield data: FRED. Updated once daily.
    </footer>
  </div>

<script>
(function () {
  // Articles arrive from the API already sorted newest-first. Flip this
  // to false if you'd rather read oldest-to-newest (top to bottom).
  const NEWEST_FIRST = true;

  const state = {
    articles: [],
    generatedAt: null,
    date: null,
    dates: [],
    filters: { region: "all", source: "all", query: "" },
  };

  const el = {
    content: document.getElementById("content"),
    generatedAt: document.getElementById("generated-at"),
    snapshot: document.getElementById("market-snapshot"),
    dateSelect: document.getElementById("date-select"),
    regionSelect: document.getElementById("region-select"),
    sourceSelect: document.getElementById("source-select"),
    searchInput: document.getElementById("search-input"),
    refreshBtn: document.getElementById("refresh-btn"),
    resultCount: document.getElementById("result-count"),
  };

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str == null ? "" : str;
    return d.innerHTML;
  }

  function fmtRelative(iso) {
    try {
      const then = new Date(iso).getTime();
      const diffMin = Math.round((Date.now() - then) / 60000);
      if (diffMin < 1) return "just now";
      if (diffMin < 60) return diffMin + "m ago";
      const diffHr = Math.round(diffMin / 60);
      if (diffHr < 24) return diffHr + "h ago";
      return Math.round(diffHr / 24) + "d ago";
    } catch (e) { return ""; }
  }

  function deltaClass(bps) {
    if (bps === null || bps === undefined) return "flat";
    if (bps > 0.5) return "up";
    if (bps < -0.5) return "down";
    return "flat";
  }
  function deltaArrow(bps) {
    const c = deltaClass(bps);
    return c === "up" ? "▲" : c === "down" ? "▼" : "—";
  }
  function fmtBps(bps) {
    if (bps === null || bps === undefined) return "n/a";
    return (bps >= 0 ? "+" : "") + bps.toFixed(0) + "bp";
  }

  // --- Inline SVG sparkline, no chart library needed ---
  function sparklineSvg(history, width, height, strokeWidth) {
    if (!history || history.length < 2) return "";
    const values = history.map(h => h.value);
    const min = Math.min(...values), max = Math.max(...values);
    const range = (max - min) || 1;
    const pad = strokeWidth + 1;
    const stepX = (width - pad * 2) / (history.length - 1);
    const pts = values.map((v, i) => {
      const x = pad + i * stepX;
      const y = pad + (height - pad * 2) * (1 - (v - min) / range);
      return [x, y];
    });
    const line = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    const area = line + ` L${pts[pts.length - 1][0].toFixed(1)},${height - pad} L${pts[0][0].toFixed(1)},${height - pad} Z`;
    const trendUp = values[values.length - 1] >= values[0];
    const color = trendUp ? "var(--up)" : "var(--down)";
    const gid = "grad" + Math.random().toString(36).slice(2, 9);
    return (
      '<svg class="sparkline" viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="none" role="img" aria-label="Yield trend, last ' + history.length + ' trading days">' +
      '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.35"/>' +
      '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      '<path d="' + area + '" fill="url(#' + gid + ')" stroke="none"/>' +
      '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="' + strokeWidth + '" stroke-linejoin="round" stroke-linecap="round"/>' +
      '</svg>'
    );
  }

  function renderMarketSnapshot(snapshot) {
    if (!snapshot || (!snapshot.narrative && !snapshot.yields)) {
      el.snapshot.innerHTML = "";
      return;
    }

    const yields = snapshot.yields || {};
    const tenY = yields.DGS10;
    const others = Object.entries(yields).filter(([id]) => id !== "DGS10");

    if (!tenY) {
      el.snapshot.innerHTML =
        '<div class="hero"><p class="hero-unavailable">' +
        escapeHtml(snapshot.narrative || "Market data unavailable today.") +
        '</p></div>';
      return;
    }

    const primaryCls = deltaClass(tenY.change_1d_bps);
    const primaryHtml =
      '<div class="hero-primary">' +
        '<div class="hero-primary-stat">' +
          '<div class="tenor-label">US 10-YEAR TREASURY</div>' +
          '<div class="value-row">' +
            '<span class="big-value">' + tenY.value.toFixed(2) + '%</span>' +
            '<span class="delta ' + primaryCls + '">' + deltaArrow(tenY.change_1d_bps) + ' ' + fmtBps(tenY.change_1d_bps) + ' today</span>' +
          '</div>' +
          (tenY.change_1w_bps !== null && tenY.change_1w_bps !== undefined
            ? '<div class="weekly">' + fmtBps(tenY.change_1w_bps) + ' over the past week</div>'
            : '') +
        '</div>' +
        '<div class="hero-chart">' + sparklineSvg(tenY.history, 320, 64, 2) + '</div>' +
      '</div>';

    const narrativeHtml = snapshot.narrative
      ? '<p class="hero-narrative">' + escapeHtml(snapshot.narrative) + '</p>'
      : "";

    const secondaryHtml = others.length
      ? '<div class="hero-secondary">' +
          others.map(([id, y]) => {
            const cls = deltaClass(y.change_1d_bps);
            return (
              '<div class="mini-stat">' +
                '<div class="tenor-label">' + escapeHtml(y.label) + '</div>' +
                '<div class="value-row">' +
                  '<span class="value">' + y.value.toFixed(2) + '%</span>' +
                  '<span class="delta ' + cls + '">' + deltaArrow(y.change_1d_bps) + ' ' + fmtBps(y.change_1d_bps) + '</span>' +
                '</div>' +
                sparklineSvg(y.history, 220, 32, 1.5) +
              '</div>'
            );
          }).join("") +
        '</div>'
      : "";

    const attributionHtml = snapshot.attribution
      ? '<p class="hero-attribution">' + escapeHtml(snapshot.attribution) + '</p>'
      : "";

    el.snapshot.innerHTML =
      '<div class="hero">' + primaryHtml + narrativeHtml + secondaryHtml + attributionHtml + '</div>';
  }

  function renderMeta() {
    el.generatedAt.textContent = state.generatedAt
      ? "updated " + new Date(state.generatedAt).toUTCString().slice(0, 22) + " UTC"
      : "";
  }

  function populateFilterOptions() {
    const regions = new Set(["all"]);
    const sources = new Set(["all"]);
    state.articles.forEach(a => {
      if (a.region) regions.add(a.region);
      if (a.source) sources.add(a.source);
    });
    function fill(select, values, currentValue, allLabel) {
      select.innerHTML = "";
      Array.from(values).forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v === "all" ? allLabel : v;
        if (v === currentValue) opt.selected = true;
        select.appendChild(opt);
      });
    }
    fill(el.regionSelect, regions, state.filters.region, "All regions");
    fill(el.sourceSelect, sources, state.filters.source, "All sources");
  }

  function populateDateOptions() {
    el.dateSelect.innerHTML = "";
    if (state.dates.length === 0) {
      const opt = document.createElement("option");
      opt.value = ""; opt.textContent = "latest";
      el.dateSelect.appendChild(opt);
      return;
    }
    state.dates.forEach((d, i) => {
      const opt = document.createElement("option");
      opt.value = d;
      opt.textContent = i === 0 ? d + " (latest)" : d;
      if (d === state.date) opt.selected = true;
      el.dateSelect.appendChild(opt);
    });
  }

  function applyFiltersAndRender() {
    const q = state.filters.query.trim().toLowerCase();
    let filtered = state.articles.filter(a => {
      if (state.filters.region !== "all" && a.region !== state.filters.region) return false;
      if (state.filters.source !== "all" && a.source !== state.filters.source) return false;
      if (q) {
        const hay = (a.title + " " + (a.summary || "")).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    if (!NEWEST_FIRST) filtered = filtered.slice().reverse();

    el.resultCount.textContent = filtered.length + " / " + state.articles.length;

    if (filtered.length === 0) {
      el.content.innerHTML = '<div class="state">No articles match these filters. <a class="retry" id="clear-filters">Clear filters</a></div>';
      const clearBtn = document.getElementById("clear-filters");
      if (clearBtn) clearBtn.addEventListener("click", clearFilters);
      return;
    }

    const ul = document.createElement("ul");
    ul.className = "feed";
    filtered.forEach(a => {
      const li = document.createElement("li");
      li.className = "article";

      const meta = document.createElement("div");
      meta.className = "article-meta";
      meta.innerHTML =
        '<span class="region">' + escapeHtml(a.region || "Global") + '</span>' +
        '<span>' + escapeHtml(a.source || "") + '</span>' +
        '<span>' + fmtRelative(a.published_at) + '</span>';

      const h2 = document.createElement("h2");
      const link = document.createElement("a");
      link.href = a.url || "#";
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = a.title;
      h2.appendChild(link);

      const p = document.createElement("p");
      p.className = "summary";
      p.textContent = a.summary || "";

      li.appendChild(meta);
      li.appendChild(h2);
      if (a.summary) li.appendChild(p);
      ul.appendChild(li);
    });

    el.content.innerHTML = "";
    el.content.appendChild(ul);
  }

  function clearFilters() {
    state.filters = { region: "all", source: "all", query: "" };
    el.searchInput.value = "";
    populateFilterOptions();
    applyFiltersAndRender();
  }

  async function loadDates() {
    try {
      const resp = await fetch("/api/dates");
      if (!resp.ok) return;
      const data = await resp.json();
      state.dates = data.dates || [];
      populateDateOptions();
    } catch (e) { /* non-fatal */ }
  }

  async function loadNews(date) {
    el.content.innerHTML = '<div class="state">Loading briefing —</div>';
    try {
      const url = date ? "/api/news?date=" + encodeURIComponent(date) : "/api/news";
      const resp = await fetch(url);
      const data = await resp.json();

      if (!resp.ok) {
        showError(data.error || "Something went wrong loading the briefing.", data.detail);
        return;
      }

      state.articles = data.articles || [];
      state.generatedAt = data.generated_at || null;
      state.date = data.date || date || null;

      renderMeta();
      renderMarketSnapshot(data.market_snapshot);
      populateFilterOptions();
      populateDateOptions();
      applyFiltersAndRender();
    } catch (e) {
      showError("Couldn't reach the briefing service.", String(e));
    }
  }

  function showError(message, detail) {
    el.snapshot.innerHTML = "";
    el.content.innerHTML =
      '<div class="state error">' + escapeHtml(message) +
      (detail ? '<br><span style="opacity:0.7">' + escapeHtml(detail) + '</span>' : '') +
      '<br><a class="retry" id="retry-link">Try again</a></div>';
    const retry = document.getElementById("retry-link");
    if (retry) retry.addEventListener("click", () => loadNews(state.date));
  }

  el.regionSelect.addEventListener("change", e => { state.filters.region = e.target.value; applyFiltersAndRender(); });
  el.sourceSelect.addEventListener("change", e => { state.filters.source = e.target.value; applyFiltersAndRender(); });
  el.searchInput.addEventListener("input", e => { state.filters.query = e.target.value; applyFiltersAndRender(); });
  el.dateSelect.addEventListener("change", e => {
    const d = e.target.value;
    state.filters = { region: "all", source: "all", query: "" };
    el.searchInput.value = "";
    loadNews(d || null);
  });
  el.refreshBtn.addEventListener("click", () => loadNews(state.date));

  loadDates();
  loadNews(null);
})();
</script>
</body>
</html>
