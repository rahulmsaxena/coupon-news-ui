<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Private Data</title>
<style>
  :root { --bg:#101114; --card:#17181B; --line:#2a2c31; --paper:#f4f1ea; --muted:#9a968d; --gold:#C9A227; --up:#FF6B5B; --down:#4FA3FF; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--paper); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px 48px; }
  .eyebrow { color:var(--gold); font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
  h1 { font: 400 32px/1.2 Georgia, serif; margin: 6px 0 8px; }
  .lede { color:var(--muted); margin:0 0 24px; max-width: 640px; }
  form { display:flex; gap:10px; flex-wrap:wrap; }
  input { flex:1 1 240px; background:var(--card); border:1px solid var(--line); color:var(--paper); border-radius:10px; padding:12px 14px; font-size:15px; }
  button { background:var(--gold); color:#17181B; border:0; border-radius:10px; padding:12px 18px; font-weight:700; font-size:15px; cursor:pointer; }
  .msg { color:var(--up); margin-top:10px; min-height:1.5em; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .card h3 { margin:0 0 6px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .v { font: 400 34px/1.1 Georgia, serif; font-variant-numeric: tabular-nums; }
  .c { font-weight:700; font-size:13px; margin:4px 0 10px; }
  .d { color:var(--muted); font-size:13px; margin-top:8px; }
  .src { color:#6f6b63; font-size:12px; margin-top:8px; }
  .src a { color:inherit; }
  .foot { color:#6f6b63; font-size:12px; margin-top:28px; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; color:var(--muted); font-size:13px; }
  .bar button { background:transparent; color:var(--muted); border:1px solid var(--line); padding:6px 12px; font-size:13px; }
  svg { display:block; width:100%; height:56px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Private</div>
  <h1>Licensed data, for your eyes only</h1>
  <p class="lede">Credit spreads and the mortgage rate. Their owners allow personal use but not republishing, so they live here behind a password instead of on point75.io. Please don't share this page or screenshots of it.</p>
  <div id="app"></div>
</div>
<script>
(function () {
  var app = document.getElementById('app');
  var KEY = 'p75-private';
  var pw = null;
  try { pw = sessionStorage.getItem(KEY); } catch (e) {}

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function login(msg) {
    app.innerHTML = '<form id="f"><input id="p" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>' +
      '<button type="submit">Unlock</button></form><div class="msg" role="alert">' + esc(msg || '') + '</div>';
    document.getElementById('f').onsubmit = function (e) {
      e.preventDefault();
      pw = document.getElementById('p').value;
      load();
    };
    document.getElementById('p').focus();
  }

  function spark(hist, color) {
    var v = hist.map(function (h) { return h.value; });
    if (v.length < 2) return '';
    var lo = Math.min.apply(null, v), hi = Math.max.apply(null, v), span = (hi - lo) || 1;
    var pts = v.map(function (x, i) { return (i / (v.length - 1) * 300).toFixed(1) + ',' + (52 - (x - lo) / span * 48).toFixed(1); }).join(' ');
    return '<svg viewBox="0 0 300 56" preserveAspectRatio="none" role="img" aria-label="Past year, from ' + lo.toFixed(2) + '% to ' + hi.toFixed(2) + '%">' +
      '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
  }

  function fmtDate(s) { return new Date(s + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }

  function show(d) {
    var colors = { hy: '#FF8A5B', ig: '#F2C94C', mortgage: '#5FD0C5' };
    var cards = (d.items || []).map(function (it) {
      var ch = it.change_4w, bp = ch == null ? null : Math.round(ch * 100);
      var chTxt = bp == null ? '' : (bp > 0 ? '+' : bp < 0 ? '−' : '') + Math.abs(bp) + 'bp in about 4 weeks';
      var col = bp > 0 ? 'var(--up)' : bp < 0 ? 'var(--down)' : 'var(--muted)';
      return '<div class="card"><h3>' + esc(it.label) + '</h3><div class="v">' + it.value.toFixed(2) + '%</div>' +
        '<div class="c" style="color:' + col + '">' + chTxt + '</div>' + spark(it.history || [], colors[it.id] || '#C9A227') +
        '<div class="d">' + esc(it.desc) + ' Higher than ' + Math.round(it.pct_1y) + '% of the past year.</div>' +
        '<div class="src">' + esc(it.owner) + ' via <a href="' + esc(it.source) + '" target="_blank" rel="noopener">FRED</a> · ' + fmtDate(it.date) + '</div></div>';
    }).join('');
    var when = new Date(d.generated_at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
    app.innerHTML = '<div class="bar"><span>Updated ' + esc(when) + ' · refreshed weekdays</span><button id="out" type="button">Lock</button></div>' +
      '<div class="grid">' + cards + '</div>' +
      (d.errors && d.errors.length ? '<p class="msg">Some series failed to update: ' + esc(d.errors.map(function (e) { return e.series; }).join(', ')) + '</p>' : '') +
      '<p class="foot">ICE BofA index data © ICE Data Indices, LLC; for personal use only. Mortgage rate © Freddie Mac. ' +
      'This product uses the FRED® API but is not endorsed or certified by the Federal Reserve Bank of St. Louis.</p>';
    document.getElementById('out').onclick = function () { try { sessionStorage.removeItem(KEY); } catch (e) {} pw = null; login(); };
  }

  function load() {
    if (!pw) return login();
    app.innerHTML = '<p class="lede">Loading…</p>';
    fetch('/api/private', { headers: { Authorization: 'Bearer ' + pw }, cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
      .then(function (x) {
        if (x.status === 401) { try { sessionStorage.removeItem(KEY); } catch (e) {} pw = null; return login('Wrong password.'); }
        if (!x.ok) return login(x.j.error || 'Something went wrong.');
        try { sessionStorage.setItem(KEY, pw); } catch (e) {}
        show(x.j);
      })
      .catch(function () { login('Could not reach the server. Try again.'); });
  }

  load();
})();
</script>
</body>
</html>
